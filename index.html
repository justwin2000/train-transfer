<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>複数区間 運賃・時間比較</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome (アイコン用) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

  <!-- ヘッダー -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 text-center shadow-lg">
    <h1 class="text-xl font-bold text-emerald-400">
      <i class="fa-solid fa-route mr-2"></i>複数区間 運賃・時間比較
    </h1>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-6">

    <!-- 条件設定エリア -->
    <section class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-md">
      <h2 class="text-md font-semibold text-slate-300 mb-4 border-b border-slate-700 pb-2">
        <i class="fa-solid fa-sliders mr-2 text-emerald-400"></i>検索条件
      </h2>

      <!-- 固定駅 -->
      <div class="mb-5">
        <label class="block text-xs font-bold text-emerald-400 uppercase tracking-wider mb-1">
          固定駅（乗車 / 降車）
        </label>
        <div class="relative">
          <input type="text" id="fixedStation" value="新大阪" 
            placeholder="例: 新大阪" 
            oninput="handleInput(this, 'fixedCandidate')"
            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 font-bold">
          <div id="fixedCandidate" class="absolute z-10 left-0 right-0 bg-slate-800 border border-slate-600 rounded-b-lg hidden shadow-xl max-h-40 overflow-y-auto mt-1"></div>
        </div>
      </div>

      <!-- 比較駅一覧 -->
      <div class="mb-5">
        <div class="flex justify-between items-center mb-2">
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">
            比較したい駅（複数選択）
          </label>
          <button onclick="addTargetInput()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded transition flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> 駅を追加
          </button>
        </div>
        
        <div id="targetStationsContainer" class="space-y-2">
          <!-- JSで初期3つを動的生成 -->
        </div>
      </div>

      <!-- 検索ボタン -->
      <button onclick="searchRoutes()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-lg shadow-lg transition duration-200 flex items-center justify-center gap-2">
        <i class="fa-solid fa-magnifying-glass"></i> 一覧比較する
      </button>
    </section>

    <!-- 結果表示エリア -->
    <section id="resultSection" class="hidden space-y-4">
      <h2 class="text-md font-semibold text-slate-300 border-b border-slate-700 pb-2 flex justify-between items-center">
        <span><i class="fa-solid fa-list-check mr-2 text-emerald-400"></i>比較結果</span>
        <span id="resultCount" class="text-xs text-slate-400"></span>
      </h2>

      <!-- 【縦割りレイアウト】 flex-col で縦1列に並べます -->
      <div id="resultCards" class="flex flex-col gap-4">
        <!-- JSでカードを動的出力 -->
      </div>
    </section>

  </main>

  <script>
    // 1. あいまい検索用の簡易辞書（エイリアス -> 標準表示名）
    const stationAliases = {
      "三ノ宮": "三ノ宮", "三宮": "三ノ宮", "神戸三宮": "三ノ宮",
      "梅田": "大阪・梅田", "大阪": "大阪・梅田", "東梅田": "大阪・梅田", "西梅田": "大阪・梅田",
      "難波": "なんば", "なんば": "なんば", "大阪難波": "なんば",
      "新大阪": "新大阪", "心斎橋": "心斎橋", "西大橋": "西大橋", "本町": "本町"
    };

    // ダミーの運賃・所要時間データ（プロトタイプ用）
    const dummyDatabase = {
      "新大阪-心斎橋": { time: 20, fare: 300 },
      "新大阪-西大橋": { time: 25, fare: 350 },
      "新大阪-本町": { time: 18, fare: 280 },
      "新大阪-三ノ宮": { time: 32, fare: 560 },
      "新大阪-大阪・梅田": { time: 5, fare: 170 },
      "新大阪-なんば": { time: 15, fare: 290 }
    };

    let targetCount = 0;

    // 初期化：入力欄を3つ生成
    window.onload = () => {
      const initialTargets = ["心斎橋", "西大橋", "本町"];
      initialTargets.forEach(val => addTargetInput(val));
    };

    // 比較駅の入力欄を追加する関数
    function addTargetInput(defaultValue = "") {
      targetCount++;
      const id = `target_${targetCount}`;
      const candidateId = `candidate_${targetCount}`;
      
      const container = document.getElementById("targetStationsContainer");
      const div = document.createElement("div");
      div.className = "flex gap-2 items-center relative";
      div.id = `group_${id}`;
      
      div.innerHTML = `
        <div class="relative flex-1">
          <input type="text" id="${id}" value="${defaultValue}" placeholder="例: 心斎橋" 
            oninput="handleInput(this, '${candidateId}')"
            class="target-input w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
          <div id="${candidateId}" class="absolute z-10 left-0 right-0 bg-slate-800 border border-slate-600 rounded-b-lg hidden shadow-xl max-h-32 overflow-y-auto mt-1"></div>
        </div>
        <button onclick="removeTargetInput('group_${id}')" class="text-slate-500 hover:text-rose-400 p-2 transition">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      `;
      container.appendChild(div);
    }

    // 入力欄削除
    function removeTargetInput(groupId) {
      const container = document.getElementById("targetStationsContainer");
      if (container.children.length > 1) {
        document.getElementById(groupId).remove();
      }
    }

    // あいまい検索・候補表示ロジック
    function handleInput(inputElem, candidateBoxId) {
      const query = inputElem.value.trim();
      const box = document.getElementById(candidateBoxId);
      box.innerHTML = "";

      if (!query) {
        box.classList.add("hidden");
        return;
      }

      const matches = Object.keys(stationAliases).filter(key => key.includes(query));

      if (matches.length > 0) {
        box.classList.remove("hidden");
        matches.forEach(match => {
          const canonicalName = stationAliases[match];
          const item = document.createElement("div");
          item.className = "px-3 py-2 hover:bg-slate-700 cursor-pointer text-sm flex justify-between items-center";
          item.innerHTML = `<span>${match}</span><span class="text-xs text-slate-400">（${canonicalName}）</span>`;
          item.onclick = () => {
            inputElem.value = match;
            box.classList.add("hidden");
          };
          box.appendChild(item);
        });
      } else {
        box.classList.add("hidden");
      }
    }

    // 検索および結果描画ロジック
    function searchRoutes() {
      const fixedVal = document.getElementById("fixedStation").value.trim();
      const targetInputs = document.querySelectorAll(".target-input");
      const cardsContainer = document.getElementById("resultCards");
      cardsContainer.innerHTML = "";

      if (!fixedVal) {
        alert("固定駅を入力してください");
        return;
      }

      let count = 0;
      targetInputs.forEach(input => {
        const targetVal = input.value.trim();
        if (!targetVal) return;

        count++;
        const normalizedFixed = stationAliases[fixedVal] || fixedVal;
        const normalizedTarget = stationAliases[targetVal] || targetVal;

        const key = `${normalizedFixed}-${normalizedTarget}`;
        const routeData = dummyDatabase[key] || {
          time: Math.floor(Math.random() * 20) + 10,
          fare: (Math.floor(Math.random() * 3) + 2) * 100
        };

        // Yahoo!乗換案内（Web）への検索URLを生成
        const yahooUrl = `https://transit.yahoo.co.jp/search/result?from=${encodeURIComponent(fixedVal)}&to=${encodeURIComponent(targetVal)}`;

        // 縦割りレイアウト用カード
        const card = document.createElement("div");
        card.className = "bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-md flex flex-col sm:flex-row items-center justify-between gap-4";
        
        card.innerHTML = `
          <!-- 乗車駅・目的地と矢印 -->
          <div class="flex items-center gap-3 w-full sm:w-auto justify-center">
            <div class="bg-white text-slate-950 font-bold py-1.5 px-3 rounded text-sm text-center min-w-[90px]">
              ${fixedVal}
            </div>
            <div class="flex flex-col items-center">
              <span class="text-xs font-bold text-emerald-400">${routeData.time}分</span>
              <i class="fa-solid fa-arrow-right text-slate-400 text-sm hidden sm:inline"></i>
              <i class="fa-solid fa-arrow-down text-slate-400 text-sm sm:hidden"></i>
            </div>
            <div class="bg-white text-slate-950 font-bold py-1.5 px-3 rounded text-sm text-center min-w-[90px]">
              ${targetVal}
            </div>
          </div>

          <!-- 運賃と乗換案内リンク -->
          <div class="flex items-center justify-between sm:justify-end gap-4 w-full sm:w-auto border-t sm:border-t-0 border-slate-700 pt-3 sm:pt-0">
            <div class="text-lg font-extrabold text-emerald-400">
              ¥${routeData.fare}
            </div>
            <a href="${yahooUrl}" target="_blank" rel="noopener noreferrer" 
              class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-3 rounded transition flex items-center gap-1 shadow">
              乗換案内を見る <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </div>
        `;

        cardsContainer.appendChild(card);
      });

      if (count > 0) {
        document.getElementById("resultCount").innerText = `${count}件の比較`;
        document.getElementById("resultSection").classList.remove("hidden");
      }
    }
  </script>
</body>
</html>
